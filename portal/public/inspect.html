<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inspections</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspections">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#101216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F5F6F8; --card: #FFFFFF; --ink: #14161A; --ink-2: #3D434D;
    --muted: #6B7280; --line: #DFE2E7; --brand-black: #101216;
    --gold: #FFC72C; --gold-hover: #FFD65C; --link: #8F6203; --head-bg: #FFFFFF;
    --pass-bg: #E2F3E6; --pass-ink: #1A6B2F;
    --warn-bg: #FDF0D7; --warn-ink: #8A5B00;
    --fail-bg: #FBE3E1; --fail-ink: #A22219;
    --chip-bg: #EEF0F3; --chip-ink: #3D434D;
    --radius: 6px; --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(16,18,22,.06), 0 1px 3px rgba(16,18,22,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --card: #181C22; --ink: #E9EBEE; --ink-2: #C2C7CF;
      --muted: #8A919C; --line: #2A2E35; --link: #FFC72C; --head-bg: #0C0E12;
      --pass-bg: #15301C; --pass-ink: #7BD694;
      --warn-bg: #352A10; --warn-ink: #ECC064;
      --fail-bg: #3A1A17; --fail-ink: #F09A92;
      --chip-bg: #242932; --chip-ink: #C2C7CF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.45 "Barlow", "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--head-bg); border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 18px 10px;
  }
  .head-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .head-inner img { height: 42px; width: auto; display: block; }
  .head-inner .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .head-inner .logo-light { display: none; }
    :root:not([data-theme="light"]) .head-inner .logo-dark { display: block; }
  }
  .head-title { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 18px; }
  .head-title small { display: block; font-family: "Barlow", sans-serif; font-weight: 500; font-size: 13px; color: var(--muted); }
  .head-right { margin-left: auto; font-size: 14px; color: var(--muted); text-align: right; }
  .head-right a { color: var(--link); font-weight: 600; text-decoration: none; }
  main { max-width: 860px; margin: 16px auto 80px; padding: 0 16px; }
  h2 {
    font-family: "Archivo", sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 26px 4px 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 16px 18px; margin: 10px 0;
  }
  .a-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .a-main { min-width: 0; }
  .a-name { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 18px; }
  .a-sub { color: var(--muted); font-size: 14.5px; margin-top: 1px; }
  .chip, .badge {
    font-size: 13px; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; white-space: nowrap;
  }
  .chip { background: var(--chip-bg); color: var(--chip-ink); }
  .b-pass { background: var(--pass-bg); color: var(--pass-ink); }
  .b-warn { background: var(--warn-bg); color: var(--warn-ink); }
  .b-fail { background: var(--fail-bg); color: var(--fail-ink); }
  .due { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .due.late { color: #C62828; }
  .btn {
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px;
    border: none; cursor: pointer; border-radius: var(--radius);
    padding: 11px 18px; min-height: 44px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-gold { background: var(--gold); color: var(--brand-black); }
  .btn-gold:active, .btn-gold:hover { background: var(--gold-hover); }
  .btn-ghost { background: var(--card); color: var(--ink-2); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--ink-2); }
  .btn-dark { background: var(--brand-black); color: #fff; }
  .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 18px 4px; font-size: 16px; }

  /* form */
  label.f {
    display: block; font-family: "Archivo", sans-serif; font-size: 12px;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 16px 0 5px;
  }
  input[type="text"], input[type="date"], input[type="email"], textarea, select {
    width: 100%; font: 500 17px "Barlow", sans-serif; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 11px 12px; min-height: 46px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .count {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 8px 10px;
  }
  .count span { flex: 1; font-size: 15.5px; font-weight: 500; }
  .count button {
    width: 42px; height: 42px; font-size: 22px; font-weight: 700;
    border-radius: var(--radius); border: 1.5px solid var(--line);
    background: var(--chip-bg); color: var(--ink); cursor: pointer;
  }
  .count input {
    width: 58px; min-height: 42px; text-align: center; padding: 4px;
    font-size: 18px; font-weight: 700;
  }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button {
    flex: 1; min-width: 150px; min-height: 54px; cursor: pointer;
    font: 700 16px "Archivo", sans-serif; border-radius: var(--radius);
    border: 2px solid var(--line); background: var(--card); color: var(--ink-2);
  }
  .seg button.on.pass { background: var(--pass-bg); color: var(--pass-ink); border-color: currentColor; }
  .seg button.on.corrected { background: var(--warn-bg); color: var(--warn-ink); border-color: currentColor; }
  .seg button.on.fail { background: var(--fail-bg); color: var(--fail-ink); border-color: currentColor; }
  .form-prop {
    background: var(--brand-black); color: #fff; border-radius: var(--radius-lg);
    padding: 16px 18px; margin-bottom: 6px;
  }
  .form-prop .a-name { color: #fff; }
  .form-prop .a-sub { color: #B9BFC9; }
  .note-pre { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--brand-black); color: #fff; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; box-shadow: var(--shadow-sm);
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .sub-detail { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; }
  .fact-label { font-family: "Archivo", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .fact-value { font-size: 15px; }
  .remarks-block { margin-top: 10px; background: var(--chip-bg); border-radius: var(--radius); padding: 10px 12px; font-size: 15px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <img class="logo-light" src="/logo.png" alt="Toner Electric">
    <img class="logo-dark" src="/logo-dark.png" alt="Toner Electric">
    <div class="head-title">Inspections
      <small id="who">Loading…</small>
    </div>
    <div class="head-right" id="head-right"></div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
const AS = new URLSearchParams(location.search).get("as");
const api = (p, opts) => fetch("/api/inspect/" + p + (AS ? (p.includes("?") ? "&" : "?") + "as=" + encodeURIComponent(AS) : ""), opts);
const $ = (id) => document.getElementById(id);
let ME = { email: "", admin: false };
let BOARD = null;
let PROPS = null;

const COUNT_FIELDS = [
  ["zones", "Zones tested"],
  ["smokes", "Smoke detectors"],
  ["heats", "Heat / fixed-temp"],
  ["pulls", "Pull stations"],
  ["horn_strobes", "Horn / strobes"],
  ["bells", "Bells"],
  ["emergency_lights", "Emergency lights"],
  ["exit_signs", "Exit signs"],
  ["flow_switches", "Flow switches"],
  ["tamper_switches", "Tamper switches"],
];
const TYPES = { quarterly: "Quarterly", semi_annual: "Semi-annual", pretest: "Pretest", acceptance: "Acceptance" };

init();
async function init() {
  const res = await api("board");
  if (!res.ok) { $("main").innerHTML = '<div class="empty">Could not load. Pull to refresh.</div>'; return; }
  BOARD = await res.json();
  ME = { email: BOARD.email, admin: BOARD.admin };
  $("who").textContent = ME.email + (ME.admin ? " · admin" : "");
  $("head-right").innerHTML = ME.admin ? '<a href="/">Records ↗</a>' : "";
  renderList();
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function typeChip(a) {
  let t = TYPES[a.inspection_type] || "Inspection";
  if (a.inspection_type === "quarterly" && a.quarter) t += " · Q" + a.quarter;
  return t;
}

function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${mo[m - 1]} ${day}, ${y}`;
}
const todayIso = () => {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
};

// ------------------------------------------------------------- list view
async function renderList() {
  const res = await api("board");
  BOARD = await res.json();
  const m = $("main");
  m.replaceChildren();

  if (ME.admin) {
    m.appendChild(h2("Review queue"));
    if (!BOARD.queue.length) m.appendChild(empty("Nothing waiting for review."));
    for (const q of BOARD.queue) m.appendChild(queueCard(q));

    m.appendChild(h2("Open assignments"));
    const open = BOARD.assignments.filter((a) => a.status === "assigned");
    if (!open.length) m.appendChild(empty("No open assignments."));
    for (const a of open) m.appendChild(assignCard(a));

    m.appendChild(h2("New assignment"));
    m.appendChild(newAssignmentCard());
  } else {
    m.appendChild(h2("Your inspections"));
    const mine = BOARD.assignments.filter((a) => a.status === "assigned");
    if (!mine.length) m.appendChild(empty("No inspections assigned to you right now."));
    for (const a of mine) m.appendChild(assignCard(a));
    const waiting = BOARD.assignments.filter((a) => a.status === "submitted");
    if (waiting.length) {
      m.appendChild(h2("Waiting on Frank's review"));
      for (const a of waiting) m.appendChild(assignCard(a, true));
    }
  }
}

function h2(t) { const n = document.createElement("h2"); n.textContent = t; return n; }
function empty(t) { const n = document.createElement("div"); n.className = "empty"; n.textContent = t; return n; }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function propBlock(a) {
  const main = el("div", "a-main");
  main.appendChild(el("div", "a-name", a.display_name || a.address));
  const bits = [];
  if (a.display_name) bits.push(a.address);
  if (a.town) bits.push(a.town);
  main.appendChild(el("div", "a-sub", bits.join(" · ")));
  return main;
}

function assignCard(a, waiting) {
  const c = el("div", "card");
  const row = el("div", "a-row");
  row.appendChild(propBlock(a));
  if (a.building) row.appendChild(el("span", "chip", a.building));
  row.appendChild(el("span", "chip", typeChip(a)));
  if (a.due_date) {
    const late = a.due_date < todayIso() && a.status === "assigned";
    row.appendChild(el("span", "due" + (late ? " late" : ""), "Due " + fmtDate(a.due_date)));
  }
  const right = el("div", "right");
  if (waiting || a.status === "submitted") {
    right.appendChild(el("span", "badge b-warn", "Submitted ✓"));
    if (ME.admin) {
      const re = el("button", "btn btn-ghost", "Reopen");
      re.onclick = () => post("reopen", { assignment_id: a.id }, "Reopened");
      right.appendChild(re);
    }
  } else {
    const go = el("button", "btn btn-gold", ME.admin ? "Open form" : "Start inspection");
    go.onclick = () => openForm(a.id);
    right.appendChild(go);
    if (ME.admin) {
      const x = el("button", "btn btn-ghost", "Cancel");
      x.onclick = () => { if (confirm("Cancel this assignment?")) post("cancel", { assignment_id: a.id }, "Cancelled"); };
      right.appendChild(x);
    }
  }
  row.appendChild(right);
  c.appendChild(row);
  if (a.notes) c.appendChild(el("div", "note-pre", "Note: " + a.notes));
  if (ME.admin && a.assigned_to) c.appendChild(el("div", "note-pre", "Assigned to " + a.assigned_to));
  return c;
}

function queueCard(q) {
  const c = el("div", "card");
  const row = el("div", "a-row");
  row.appendChild(propBlock(q));
  if (q.building) row.appendChild(el("span", "chip", q.building));
  row.appendChild(el("span", "chip", typeChip(q)));
  const ob = { pass: ["b-pass", "SYSTEM OK"], corrected: ["b-warn", "CORRECTED"], fail: ["b-fail", "NEEDS REPAIRS"] }[q.outcome];
  if (ob) row.appendChild(el("span", "badge " + ob[0], ob[1]));
  const right = el("div", "right");
  const ok = el("button", "btn btn-gold", "Approve → archive");
  ok.onclick = () => post("approve", { submission_id: q.submission_id }, "Approved and filed");
  const re = el("button", "btn btn-ghost", "Send back");
  re.onclick = () => post("reopen", { assignment_id: q.assignment_id }, "Sent back");
  right.appendChild(ok); right.appendChild(re);
  row.appendChild(right);
  c.appendChild(row);

  let form = {};
  try { form = JSON.parse(q.form_json); } catch {}
  const d = el("div", "sub-detail");
  const facts = el("div", "facts");
  const fact = (l, v) => { if (!v) return; const f = el("div"); f.appendChild(el("div", "fact-label", l)); f.appendChild(el("div", "fact-value", v)); facts.appendChild(f); };
  fact("Date", fmtDate(form.date));
  fact("Technician", form.technician || q.submitted_by);
  fact("Panel", form.panel);
  fact("Master box", form.master_box);
  for (const [k, label] of COUNT_FIELDS) if (form.counts && form.counts[k] != null && form.counts[k] !== "") fact(label, String(form.counts[k]));
  d.appendChild(facts);
  if (form.remarks) {
    const r = el("div", "remarks-block");
    r.appendChild(el("div", "fact-label", q.outcome === "fail" ? "Repairs needed" : "Remarks"));
    r.appendChild(el("div", "", form.remarks));
    d.appendChild(r);
  }
  c.appendChild(d);
  return c;
}

function newAssignmentCard() {
  const c = el("div", "card");
  c.innerHTML = `
    <label class="f">Property</label>
    <input id="na-prop" type="text" list="na-prop-list" placeholder="Start typing a name or address…" autocomplete="off">
    <datalist id="na-prop-list"></datalist>
    <div class="grid2">
      <div><label class="f">Building / system (optional)</label>
        <input id="na-bldg" type="text" list="na-bldg-list" placeholder="e.g. Bldg 3"><datalist id="na-bldg-list"></datalist></div>
      <div><label class="f">Type</label>
        <select id="na-type">
          <option value="quarterly">Quarterly</option>
          <option value="semi_annual">Semi-annual</option>
          <option value="pretest">Pretest</option>
          <option value="acceptance">Acceptance</option>
        </select></div>
    </div>
    <div class="grid2">
      <div><label class="f">Quarter</label>
        <select id="na-q"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <div><label class="f">Due date</label><input id="na-due" type="date"></div>
    </div>
    <label class="f">Assign to (email)</label>
    <input id="na-who" type="email" placeholder="technician@email.com" autocomplete="off">
    <label class="f">Notes for the tech (optional)</label>
    <input id="na-notes" type="text" placeholder="Gate code, contact, parking…">
    <div style="margin-top:16px"><button class="btn btn-dark" id="na-go">Assign inspection</button></div>
  `;
  loadProps(c);
  c.querySelector("#na-type").onchange = (e) => {
    const q = c.querySelector("#na-q");
    q.value = e.target.value === "quarterly" ? q.value : "";
  };
  c.querySelector("#na-go").onclick = async () => {
    const pick = parseProp(c.querySelector("#na-prop").value);
    if (!pick) { toast("Pick a property from the list"); return; }
    const payload = {
      property_id: pick,
      building: c.querySelector("#na-bldg").value.trim() || null,
      inspection_type: c.querySelector("#na-type").value,
      quarter: c.querySelector("#na-q").value || null,
      due_date: c.querySelector("#na-due").value || null,
      assigned_to: c.querySelector("#na-who").value.trim(),
      notes: c.querySelector("#na-notes").value.trim() || null,
    };
    if (!payload.assigned_to) { toast("Who is this assigned to?"); return; }
    await post("assign", payload, "Assigned");
  };
  return c;
}

let PROP_INDEX = new Map();
async function loadProps(card) {
  if (!PROPS) {
    const r = await api("properties");
    if (!r.ok) return;
    PROPS = await r.json();
  }
  const dl = card.querySelector("#na-prop-list");
  PROP_INDEX = new Map();
  for (const p of PROPS.properties) {
    const label = `${p.display_name || p.address}${p.display_name ? " — " + p.address : ""} (#${p.id})`;
    PROP_INDEX.set(label, p.id);
    const o = document.createElement("option");
    o.value = label;
    dl.appendChild(o);
  }
  const bl = card.querySelector("#na-bldg-list");
  const seen = new Set();
  for (const b of PROPS.buildings) {
    if (seen.has(b.building)) continue;
    seen.add(b.building);
    const o = document.createElement("option");
    o.value = b.building;
    bl.appendChild(o);
  }
}
function parseProp(v) {
  if (PROP_INDEX.has(v)) return PROP_INDEX.get(v);
  const m = v.match(/#(\d+)\)\s*$/);
  return m ? Number(m[1]) : null;
}

async function post(path, payload, okMsg) {
  const r = await api(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok || body.error) { toast(body.error || "Something went wrong"); return false; }
  toast(okMsg);
  renderList();
  window.scrollTo({ top: 0 });
  return true;
}

// ------------------------------------------------------------- form view
async function openForm(assignmentId) {
  const r = await api("prefill?assignment_id=" + assignmentId);
  if (!r.ok) { toast("Could not load the form"); return; }
  const { assignment: a, last, lastForm } = await r.json();
  const m = $("main");
  m.replaceChildren();

  const head = el("div", "form-prop");
  const row = el("div", "a-row");
  row.appendChild(propBlock(a));
  if (a.building) row.appendChild(el("span", "chip", a.building));
  row.appendChild(el("span", "chip", typeChip(a)));
  head.appendChild(row);
  if (a.notes) head.appendChild(el("div", "note-pre", "Note from Frank: " + a.notes));
  m.appendChild(head);

  const card = el("div", "card");
  card.innerHTML = `
    <div class="grid2">
      <div><label class="f">Inspection date</label><input id="f-date" type="date"></div>
      <div><label class="f">Technician</label><input id="f-tech" type="text" placeholder="Your name"></div>
    </div>
    <div class="grid2">
      <div><label class="f">Panel</label><input id="f-panel" type="text" placeholder="e.g. Firelite (addressable)"></div>
      <div><label class="f">Master box / ID #</label><input id="f-mbox" type="text"></div>
    </div>
    <label class="f">Devices tested</label>
    <div class="counts" id="f-counts"></div>
    <div class="note-pre">Leave a count blank if that device type doesn't exist here.</div>
    <label class="f">Result</label>
    <div class="seg" id="f-outcome">
      <button data-v="pass" class="pass">System OK</button>
      <button data-v="corrected" class="corrected">Problems corrected</button>
      <button data-v="fail" class="fail">Needs repairs</button>
    </div>
    <label class="f">Remarks / repairs needed</label>
    <textarea id="f-remarks" placeholder="What was found, fixed, or still needs repair…"></textarea>
    <div style="margin-top:18px; display:flex; gap:10px; flex-wrap:wrap">
      <button class="btn btn-gold" id="f-submit" style="flex:1; min-height:54px">Submit to Frank</button>
      <button class="btn btn-ghost" id="f-back">Back</button>
    </div>
  `;
  m.appendChild(card);

  $("f-date").value = todayIso();
  $("f-tech").value = (lastForm && lastForm.technician) || "";
  $("f-panel").value = (lastForm && lastForm.panel) || last.panel || "";
  $("f-mbox").value = (lastForm && lastForm.master_box) || last.master_box || "";
  if (last.date) card.querySelector("#f-counts").insertAdjacentHTML("beforebegin",
    `<div class="note-pre">Prefilled from the last inspection on ${fmtDate(last.date)}.</div>`);

  const counts = $("f-counts");
  for (const [k, label] of COUNT_FIELDS) {
    const w = el("div", "count");
    w.appendChild(el("span", "", label));
    const minus = el("button", "", "−"); minus.type = "button";
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "numeric"; inp.id = "cnt-" + k;
    inp.value = lastForm && lastForm.counts && lastForm.counts[k] != null ? lastForm.counts[k] : "";
    const plus = el("button", "", "+"); plus.type = "button";
    minus.onclick = () => { inp.value = Math.max(0, (Number(inp.value) || 0) - 1); };
    plus.onclick = () => { inp.value = (Number(inp.value) || 0) + 1; };
    w.appendChild(minus); w.appendChild(inp); w.appendChild(plus);
    counts.appendChild(w);
  }

  let outcome = "";
  for (const b of card.querySelectorAll("#f-outcome button")) {
    b.type = "button";
    b.onclick = () => {
      outcome = b.dataset.v;
      for (const x of card.querySelectorAll("#f-outcome button")) x.classList.toggle("on", x === b);
    };
  }

  $("f-back").onclick = renderList;
  $("f-submit").onclick = async () => {
    if (!outcome) { toast("Pick a result"); return; }
    const remarks = $("f-remarks").value.trim();
    if (outcome === "fail" && !remarks) { toast("Describe the repairs needed"); return; }
    const cts = {};
    for (const [k] of COUNT_FIELDS) {
      const v = $("cnt-" + k).value.trim();
      if (v !== "" && !isNaN(Number(v))) cts[k] = Number(v);
    }
    const ok = await post("submit", {
      assignment_id: a.id,
      form: {
        date: $("f-date").value,
        technician: $("f-tech").value.trim(),
        panel: $("f-panel").value.trim(),
        master_box: $("f-mbox").value.trim(),
        counts: cts,
        outcome,
        remarks,
      },
    }, "Submitted — Frank will review it");
  };
  window.scrollTo({ top: 0 });
}
</script>
</body>
</html>
