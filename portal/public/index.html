<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fire Alarm Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* Matches css/style.css on www.tonerelectric.com */
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --ink: #14161A;
    --ink-2: #3D434D;
    --muted: #6B7280;
    --line: #DFE2E7;
    --brand-black: #101216;
    --gold: #FFC72C;
    --gold-hover: #FFD65C;
    --gold-deep: #8F6203;
    --link: #8F6203;
    --head-bg: #FFFFFF;
    --pass-bg: #E2F3E6; --pass-ink: #1A6B2F;
    --warn-bg: #FDF0D7; --warn-ink: #8A5B00;
    --fail-bg: #FBE3E1; --fail-ink: #A22219;
    --over: #C62828;
    --chip-bg: #EEF0F3; --chip-ink: #3D434D;
    --radius: 6px; --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(16,18,22,.06), 0 1px 3px rgba(16,18,22,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --card: #181C22; --ink: #E9EBEE; --ink-2: #C2C7CF;
      --muted: #8A919C; --line: #2A2E35; --link: #FFC72C; --head-bg: #0C0E12;
      --pass-bg: #15301C; --pass-ink: #7BD694;
      --warn-bg: #352A10; --warn-ink: #ECC064;
      --fail-bg: #3A1A17; --fail-ink: #F09A92;
      --chip-bg: #242932; --chip-ink: #C2C7CF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.45 "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  header {
    background: var(--head-bg); border-bottom: 1px solid var(--line);
    padding: 12px 20px;
  }
  .head-inner {
    max-width: 1020px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .head-inner img { height: 46px; width: auto; display: block; }
  .head-inner .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .head-inner .logo-light { display: none; }
    :root:not([data-theme="light"]) .head-inner .logo-dark { display: block; }
  }
  .head-title {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 700; font-size: 19px; letter-spacing: .01em;
  }
  .head-title small {
    display: block; font-family: "Barlow", sans-serif; font-weight: 500;
    font-size: 13.5px; color: var(--muted); letter-spacing: .02em;
  }
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px;
  }
  .controls-inner { max-width: 1020px; margin: 0 auto; }
  #q {
    width: 100%; font-size: 19px; padding: 12px 16px;
    font-family: "Barlow", sans-serif;
    border: 2px solid var(--line); border-radius: var(--radius-lg);
    background: var(--card); color: var(--ink); outline: none;
  }
  #q:focus { border-color: var(--gold); }
  .filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .filters select {
    font-size: 15px; font-family: "Barlow", sans-serif; padding: 7px 10px;
    border-radius: var(--radius);
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  .filters label.check {
    display: inline-flex; align-items: center; gap: 6px; font-size: 15px;
    color: var(--ink-2); padding: 6px 4px; cursor: pointer; user-select: none;
  }
  .filters input[type="checkbox"] { accent-color: var(--gold-deep); }
  #clear {
    font-size: 14px; font-weight: 600; border: none; background: none;
    color: var(--link); cursor: pointer; padding: 6px 4px; display: none;
    font-family: "Barlow", sans-serif;
  }
  .counts { max-width: 1020px; margin: 14px auto 0; padding: 0 20px; color: var(--muted); font-size: 15px; }
  main { max-width: 1020px; margin: 10px auto 60px; padding: 0 20px; }
  .prop {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    margin: 14px 0; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .prop-head { padding: 14px 18px 10px; }
  .prop-name {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 20px; font-weight: 700;
  }
  .prop-name .badge { margin-left: 10px; vertical-align: 3px; }
  .prop-sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .row:first-child { border-top: none; }
  .row:hover { background: color-mix(in srgb, var(--chip-bg) 45%, var(--card)); }
  .d {
    font-weight: 700; min-width: 112px; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .badge, .chip {
    font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0;
  }
  .chip { background: var(--chip-bg); color: var(--chip-ink); }
  .chip.shrink { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .b-pass { background: var(--pass-bg); color: var(--pass-ink); }
  .b-warn { background: var(--warn-bg); color: var(--warn-ink); }
  .b-fail { background: var(--fail-bg); color: var(--fail-ink); }
  .b-rev  { background: var(--warn-bg); color: var(--warn-ink); }
  .b-over { background: var(--over); color: #fff; }
  .open {
    font-family: "Archivo", sans-serif; font-size: 14px; font-weight: 700;
    text-decoration: none; color: var(--brand-black);
    background: var(--gold); border-radius: var(--radius); padding: 7px 12px;
    margin-left: auto; flex-shrink: 0;
  }
  .open:hover { background: var(--gold-hover); }
  .open.none { background: var(--chip-bg); color: var(--muted); pointer-events: none; }
  .drive {
    font-family: "Archivo", sans-serif; font-size: 14px; font-weight: 700;
    text-decoration: none; color: var(--ink-2); background: var(--card);
    border: 1.5px solid var(--line); border-radius: var(--radius); padding: 6px 11px;
    flex-shrink: 0;
  }
  .drive:hover { border-color: var(--ink-2); }
  .caret {
    flex-shrink: 0; color: var(--muted); font-size: 13px;
    transition: transform .15s ease; width: 14px; text-align: center;
  }
  .row[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .details {
    padding: 4px 18px 16px; border-top: 1px dashed var(--line);
    background: color-mix(in srgb, var(--chip-bg) 30%, var(--card));
  }
  .facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px 18px; padding-top: 12px;
  }
  .fact-label {
    font-family: "Archivo", sans-serif; font-size: 11.5px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .fact-value { font-size: 15px; color: var(--ink); margin-top: 1px; overflow-wrap: anywhere; }
  .note { margin-top: 12px; border-radius: var(--radius); padding: 10px 14px; font-size: 15px; }
  .note .fact-label { margin-bottom: 3px; }
  .note.warn { background: var(--warn-bg); } .note.warn .fact-label { color: var(--warn-ink); }
  .note.fail { background: var(--fail-bg); } .note.fail .fact-label { color: var(--fail-ink); }
  .note.plain { background: var(--chip-bg); }
  .note ul { margin: 2px 0 0; padding-left: 20px; }
  .empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 18px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }
  @media (max-width: 760px) {
    .row { flex-wrap: wrap; }
    .d { min-width: 100px; }
    .head-inner img { height: 38px; }
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <img class="logo-light" src="/logo.png" alt="Toner Electric Company">
    <img class="logo-dark" src="/logo-dark.png" alt="Toner Electric Company">
    <div class="head-title">Fire Alarm Inspection Records
      <small>Private records portal · Newport County, RI</small>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <input id="q" type="search" placeholder="Search address, property, town, or serial #…" autocomplete="off" autofocus>
    <div class="filters">
      <select id="f-town"><option value="">All towns</option></select>
      <select id="f-year"><option value="">All years</option></select>
      <select id="f-type">
        <option value="">All types</option>
        <option value="quarterly">Quarterly</option>
        <option value="semi_annual">Semi-annual</option>
        <option value="pretest">Pretest</option>
        <option value="acceptance">Acceptance test</option>
      </select>
      <select id="f-outcome">
        <option value="">Any outcome</option>
        <option value="pass">Pass</option>
        <option value="corrected">Problems corrected</option>
        <option value="fail">Needs repairs</option>
      </select>
      <label class="check"><input id="f-overdue" type="checkbox"> Overdue</label>
      <label class="check"><input id="f-review" type="checkbox"> Needs review</label>
      <button id="clear">Clear all</button>
    </div>
  </div>
</div>

<div class="counts" id="counts">Loading records…</div>
<main id="results"></main>
<footer>Private records portal · Toner Electric Company · Middletown, RI</footer>

<script>
let MODEL = { properties: [], byProp: new Map() };

const $ = (id) => document.getElementById(id);
const els = {
  q: $("q"), town: $("f-town"), year: $("f-year"), type: $("f-type"),
  outcome: $("f-outcome"), review: $("f-review"), overdue: $("f-overdue"),
  clear: $("clear"), counts: $("counts"), results: $("results"),
};
let TODAY = "";

init();

async function init() {
  let data;
  try {
    const res = await fetch("/api/index");
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    els.counts.textContent = "Could not load records. Refresh to try again.";
    return;
  }
  const byProp = new Map();
  for (const p of data.properties) {
    let aliases = [];
    try { aliases = JSON.parse(p.aliases || "[]"); } catch {}
    byProp.set(p.id, { ...p, aliasText: aliases.join(" ").toLowerCase(), inspections: [] });
  }
  for (const i of data.inspections) {
    const p = byProp.get(i.property_id);
    if (p) p.inspections.push(i);
  }
  MODEL = { properties: [...byProp.values()], byProp, meta: data.meta || {} };
  computeDue();

  fillSelect(els.town, distinct(MODEL.properties.map((p) => p.town)));
  const years = distinct(
    data.inspections.map((i) => (i.date || "").slice(0, 4)).filter(Boolean)
  ).sort().reverse();
  fillSelect(els.year, years);

  for (const el of [els.town, els.year, els.type, els.outcome, els.review, els.overdue])
    el.addEventListener("change", render);
  els.q.addEventListener("input", render);
  els.clear.addEventListener("click", () => {
    els.q.value = ""; els.town.value = ""; els.year.value = "";
    els.type.value = ""; els.outcome.value = ""; els.review.checked = false;
    els.overdue.checked = false;
    render(); els.q.focus();
  });
  render();
}

// Next-due + overdue. Every dated quarterly/semi-annual record gets a
// next_due (+3 or +6 months). Only the LATEST dated record per
// property+building is the current cycle; it is overdue when its next_due
// has passed with no newer inspection on file. Older records are history,
// never overdue — their follow-up already happened.
function computeDue() {
  const INTERVAL = { quarterly: 3, semi_annual: 6 };
  TODAY = isoToday();
  for (const p of MODEL.properties) {
    p.overdueCount = 0;
    const latest = new Map();
    for (const i of p.inspections) {
      const m = INTERVAL[i.inspection_type];
      if (i.date && m) i.next_due = addMonths(i.date, m);
      if (!i.date) continue;
      const k = i.building || "";
      const cur = latest.get(k);
      if (!cur || i.date > cur.date) latest.set(k, i);
    }
    for (const i of latest.values()) {
      if (!i.next_due) continue;
      i.is_current = true;
      if (i.next_due < TODAY) { i.overdue = true; p.overdueCount++; }
    }
  }
}

function addMonths(iso, m) {
  let [y, mo, d] = iso.split("-").map(Number);
  mo += m; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12) + 1;
  const last = new Date(y, mo, 0).getDate();
  if (d > last) d = last;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function isoToday() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
}

function daysLate(iso) {
  const utc = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((utc(TODAY) - utc(iso)) / 86400000);
}

function distinct(arr) {
  return [...new Set(arr.filter(Boolean))].sort();
}

function fillSelect(sel, values) {
  for (const v of values) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
}

function norm(s) {
  return (s || "").toLowerCase().replace(/[.,#']/g, " ").replace(/\s+/g, " ").trim();
}

function render() {
  const q = norm(els.q.value);
  const town = els.town.value, year = els.year.value,
        type = els.type.value, outcome = els.outcome.value,
        reviewOnly = els.review.checked, overdueOnly = els.overdue.checked;
  const filtering = q || town || year || type || outcome || reviewOnly || overdueOnly;
  els.clear.style.display = filtering ? "inline" : "none";

  let shownProps = 0, shownInsp = 0;
  const frag = document.createDocumentFragment();

  for (const p of MODEL.properties) {
    if (town && p.town !== town) continue;
    const hay = norm(
      [p.display_name, p.address, p.town, p.aliasText].join(" ")
    );
    const serialHit = q && p.inspections.some((i) => (i.marshal_serial || "").includes(els.q.value.trim()));
    if (q && !hay.includes(q) && !serialHit) continue;

    const rows = p.inspections.filter((i) => {
      if (year && (i.date || "").slice(0, 4) !== year) return false;
      if (type && i.inspection_type !== type) return false;
      if (outcome && i.outcome !== outcome) return false;
      if (reviewOnly && !i.needs_review) return false;
      if (overdueOnly && !i.overdue) return false;
      return true;
    });
    if (!rows.length) continue;

    shownProps++; shownInsp += rows.length;
    frag.appendChild(propCard(p, rows));
  }

  els.results.replaceChildren(frag);
  if (!shownProps) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = filtering
      ? "No records match. Try fewer filters or a shorter search."
      : "No records loaded yet.";
    els.results.appendChild(d);
  }
  const totalInsp = MODEL.properties.reduce((n, p) => n + p.inspections.length, 0);
  const overProps = MODEL.properties.filter((p) => p.overdueCount).length;
  els.counts.textContent = filtering
    ? `Showing ${shownInsp} inspection${shownInsp === 1 ? "" : "s"} at ${shownProps} propert${shownProps === 1 ? "y" : "ies"}`
    : `${totalInsp} inspections · ${MODEL.properties.length} properties on file` +
      (overProps ? ` · ${overProps} overdue` : "");
}

function propCard(p, rows) {
  const card = el("div", "prop");
  const head = el("div", "prop-head");
  const name = p.display_name || p.address;
  const nameDiv = el("div", "prop-name", name);
  if (p.overdueCount) nameDiv.appendChild(el("span", "badge b-over", "OVERDUE"));
  head.appendChild(nameDiv);
  const subBits = [];
  if (p.display_name) subBits.push(p.address);
  if (p.town) subBits.push(p.town);
  head.appendChild(el("div", "prop-sub", subBits.join(" · ") || "—"));
  card.appendChild(head);

  const list = el("div", "rows");
  for (const i of rows) list.appendChild(inspRow(i));
  card.appendChild(list);
  return card;
}

function inspRow(i) {
  const row = el("div", "row");
  row.setAttribute("role", "button");
  row.setAttribute("tabindex", "0");
  row.setAttribute("aria-expanded", "false");
  row.title = "Click for details";
  row.appendChild(el("div", "d", fmtDate(i.date)));
  if (i.building) row.appendChild(el("span", "chip shrink", i.building));
  row.appendChild(el("span", "chip", typeLabel(i)));
  const o = outcomeBadge(i.outcome);
  if (o) row.appendChild(o);
  if (i.needs_review) {
    const r = el("span", "badge b-rev", "⚠ review");
    r.title = "Click for what needs confirming";
    row.appendChild(r);
  }
  if (i.is_current && i.next_due) {
    if (i.overdue) {
      const n = daysLate(i.next_due);
      const b = el("span", "badge b-over", `OVERDUE ${n} day${n === 1 ? "" : "s"}`);
      b.title = `Next ${typeLabel(i).toLowerCase()} was due ${fmtDate(i.next_due)}`;
      row.appendChild(b);
    } else {
      const c = el("span", "chip", `Due ${fmtDate(i.next_due)}`);
      c.title = "Next inspection due, based on this type's interval";
      row.appendChild(c);
    }
  }
  const a = el("a", "open" + (i.has_pdf ? "" : " none"), i.has_pdf ? "Open PDF" : "No PDF");
  if (i.has_pdf) { a.href = "/api/pdf/" + i.id; a.target = "_blank"; a.rel = "noopener"; }
  row.appendChild(a);
  if (i.drive_file_id) {
    const g = el("a", "drive", "Drive");
    g.href = "https://drive.google.com/file/d/" + i.drive_file_id + "/view";
    g.target = "_blank"; g.rel = "noopener";
    g.title = "Show in Google Drive";
    row.appendChild(g);
  }
  row.appendChild(el("span", "caret", "▶"));

  let panel = null;
  const toggle = () => {
    if (!panel) {
      panel = detailsPanel(i);
      panel.style.display = "none";
      row.insertAdjacentElement("afterend", panel);
    }
    const open = panel.style.display !== "none";
    panel.style.display = open ? "none" : "";
    row.setAttribute("aria-expanded", String(!open));
  };
  row.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    toggle();
  });
  row.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target === row) { e.preventDefault(); toggle(); }
  });
  return row;
}

function detailsPanel(i) {
  const d = el("div", "details");

  const facts = el("div", "facts");
  const addFact = (label, value) => {
    if (!value) return;
    const f = el("div", "fact");
    f.appendChild(el("div", "fact-label", label));
    f.appendChild(el("div", "fact-value", value));
    facts.appendChild(f);
  };
  addFact("Marshal serial #", i.marshal_serial);
  addFact("Master box", i.master_box);
  addFact("Panel", i.panel);
  if (i.is_current && i.next_due) addFact("Next inspection due", fmtDate(i.next_due));
  addFact("Original scan", i.source_file && `${i.source_file}${i.source_pages ? " · p. " + i.source_pages : ""}`);
  if (facts.children.length) d.appendChild(facts);

  if (i.needs_review && i.review_reason) {
    const n = el("div", "note warn");
    n.appendChild(el("div", "fact-label", "Needs confirmation"));
    const ul = el("ul");
    for (const r of i.review_reason.split("; "))
      ul.appendChild(el("li", "", r.replace(/_/g, " ")));
    n.appendChild(ul);
    d.appendChild(n);
  }

  if (i.outcome === "fail") {
    const n = el("div", "note fail");
    n.appendChild(el("div", "fact-label", "Repairs needed"));
    n.appendChild(el("div", "", i.remarks || "The report is marked needs-repairs; open the PDF for the inspector's repair list."));
    d.appendChild(n);
  } else if (i.remarks) {
    const n = el("div", "note plain");
    n.appendChild(el("div", "fact-label", "Inspector remarks"));
    n.appendChild(el("div", "", i.remarks));
    d.appendChild(n);
  }

  if (!d.children.length) d.appendChild(el("div", "fact-value", "No extra details for this record — everything is on the PDF."));
  return d;
}

function typeLabel(i) {
  switch (i.inspection_type) {
    case "quarterly": return i.quarter ? `Quarterly · Q${i.quarter}` : "Quarterly";
    case "semi_annual": return "Semi-annual";
    case "pretest": return "Pretest";
    case "acceptance": return "Acceptance";
    case "contract": return "Contract";
    default: return "Inspection";
  }
}

function outcomeBadge(o) {
  if (o === "pass") return el("span", "badge b-pass", "PASS");
  if (o === "corrected") return el("span", "badge b-warn", "CORRECTED");
  if (o === "fail") return el("span", "badge b-fail", "NEEDS REPAIRS");
  return null;
}

function fmtDate(d) {
  if (!d) return "No date";
  const [y, m, day] = d.split("-").map(Number);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if (!y || !m || !day) return d;
  return `${months[m - 1]} ${day}, ${y}`;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
</script>
</body>
</html>
